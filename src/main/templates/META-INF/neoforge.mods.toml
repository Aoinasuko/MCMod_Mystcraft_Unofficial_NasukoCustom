[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},26.4)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[31.16,32)"
ordering="NONE"
side="CLIENT"
